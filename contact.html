<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Professional Profiles</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ring: rgba(37, 99, 235, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #f1f5f9;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .contact-item a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }

    .links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .profile-link:hover {
      border-color: var(--accent);
      background-color: var(--ring);
      color: var(--accent);
    }

    .profile-link span.platform {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .external-icon {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .profile-link:hover .external-icon {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <main class="card">
    <header>
      <h1>Shah Aftab</h1>
      <p class="subtitle">Business information & IT student. Reach out directly or explore my public profiles below.</p>
    </header>

    <div class="section">
      <h2 class="section-title">Direct Contact</h2>
      <div class="contact-item">
        <span>Email</span>
        <a href="mailto:shah.aftab.dev@example.com" aria-label="Send email to Shah Aftab"><shah class="aftab"></shah>.dev@example.com</a>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Professional Profiles</h2>
      <ul class="links-list">
        <li>
          <a class="profile-link" href="[linkedin.com](https://linkedin.com/in/example)" target="_blank" rel="noopener noreferrer" aria-label="Visit Shah Aftab's LinkedIn profile (opens in new tab)">
            <span class="platform">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.46 1.46 0 1 0 0-2.92 1.46 1.46 0 0 0 0 2.92M7.86 18.5V10.13H5.07V18.5h2.79Z"/></svg>
              LinkedIn Profile
            </span>
            <span class="external-icon">&#8599;</span>
          </a>
        </li>
        <li>
          <a class="profile-link" href="[github.com](https://github.com/example)" target="_blank" rel="noopener noreferrer" aria-label="Visit Shah Aftab's GitHub profile (opens in new tab)">
            <span class="platform">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2Z"/></svg>
              GitHub Portfolio
            </span>
            <span class="external-icon">&#8599;</span>
          </a>
        </li>
        <li>
          <a class="profile-link" href="[scholar.google.com](https://scholar.google.com/citations?user=example)" target="_blank" rel="noopener noreferrer" aria-label="Visit Alex Mercer's Google Scholar citations (opens in new tab)">
            <span class="platform">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82Z"/></svg>
              Google Scholar Citations
            </span>
            <span class="external-icon">&#8599;</span>
          </a>
        </li>
      </ul>
    </div>
  </main>

</body>
</html>
